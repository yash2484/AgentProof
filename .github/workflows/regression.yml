name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate 1 — the detector itself, against a committed corpus with known
  # variance. This exercises the Welch's t-test + Cohen's d path.
  fixture-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect eval-score regressions (fixture corpus)
        uses: ./
        with:
          traces: fixtures/regression_corpus.json
          baseline: baselines/demo-research-agent.json
          config: fixtures/regression_config.yaml

  # Gate 2 — the agent itself. Runs the LangGraph demo agent on this commit,
  # captures the traces it actually produces, and gates them against a pinned
  # baseline. A change that makes the agent less faithful or less
  # injection-resistant fails here, on the PR that introduced it.
  #
  # Replay mode is deterministic and needs no API key, so this costs nothing
  # per PR and cannot flake on model nondeterminism.
  #
  # This job consumes the published composite action via `uses: ./` rather than
  # hand-rolled steps, on purpose: the thing a stranger adds to their pipeline
  # is the thing this repository runs on every pull request. If the action
  # breaks, this job breaks.
  agent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate the captured traces against the pinned baseline
        uses: ./
        with:
          extra-install: -e ./sdk -e ./demo_agent
          capture-command: >-
            python -m demo_agent capture
            --scenario all
            --mode replay
            --project demo-research-agent
            --out "${RUNNER_TEMP}/agent_corpus.json"
          traces: ${{ runner.temp }}/agent_corpus.json
          baseline: baselines/demo-agent-replay.json
          config: fixtures/regression_config.yaml

  # Does a judge key exist for this run? `secrets` is not readable from a
  # job-level `if:`, so the answer has to come out of a job. Pull requests from
  # forks get no secrets, so this reports false there and the judged gate skips
  # instead of failing someone else's contribution.
  judge-key:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANTHROPIC_API_KEY secret — the judged gate will skip."
          fi

  # Gate 3 — the judged gate. Every metric gate 2 can run has zero variance on
  # this corpus, so the detector falls back to an absolute-drop floor and the
  # verdict is a threshold check. `faithfulness` and `relevance` are the only
  # metrics with the spread to produce a t-test and an effect size, and they
  # need a judge. This is the job that exercises the statistical claim.
  #
  # Costs real tokens per run (two judged metrics over 13 traces). That is the
  # price of gating on something a threshold cannot see.
  judge-gate:
    runs-on: ubuntu-latest
    needs: judge-key
    if: needs.judge-key.outputs.present == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Gate judged metrics against the pinned baseline
        uses: ./
        with:
          extra-install: -e ./sdk -e ./demo_agent
          capture-command: >-
            python -m demo_agent capture
            --scenario all
            --mode replay
            --project demo-research-agent
            --out "${RUNNER_TEMP}/agent_corpus.json"
          traces: ${{ runner.temp }}/agent_corpus.json
          baseline: baselines/demo-agent-replay.json
          config: fixtures/regression_config.yaml
          judged-config: fixtures/regression_config_judged.yaml
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
