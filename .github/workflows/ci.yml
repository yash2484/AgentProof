name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a break that arrives from a dependency release rather than a
  # commit surfaces on its own schedule. A build backend once started rejecting
  # a two-month-old config line, and the first push after it carried the blame.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned deliberately. ruff is pre-1.0 and ships new rules in ordinary
      # releases, so an unpinned linter fails the build on code nobody touched.
      # Bump it as a commit, so the new findings land in a reviewable diff.
      - run: pip install ruff==0.15.16
      # Matches the scope the README claims is clean. scripts/ holds the visual
      # gates and went unlinted here for months.
      - run: ruff check sdk/ server/ demo_agent/ scripts/

  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          cd sdk
          pip install -e ".[dev]"
      - run: cd sdk && pytest tests/ -v

  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
          POSTGRES_DB: agentproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server
        run: |
          cd server
          pip install -e ".[dev]"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://agentproof:agentproof@localhost:5432/agentproof
        run: cd server && pytest tests/ -v

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm ci
      - run: cd dashboard && npm test
      - run: cd dashboard && npx tsc -b
      - run: cd dashboard && npx eslint . --ext ts,tsx